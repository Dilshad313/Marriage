        html{scroll-behavior:smooth;scroll-padding-top:var(--nav-h);overflow-x:hidden;max-width:100vw}
        body{background:var(--ivory);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:100vw}
        .app{overflow-x:hidden;max-width:100vw;width:100%}
        .eyebrow{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.6rem}
        .section{padding:clamp(4rem,8vw,6.5rem) 0;position:relative}
        .container{width:min(1180px,92vw);margin:0 auto}
        .section-head{text-align:center;margin-bottom:3.2rem}
        .section-title{font-family:var(--serif);font-size:clamp(2.2rem,5vw,3.6rem);font-weight:400;line-height:1.1;color:var(--emerald-900)}
        .section-title em{font-style:italic;font-weight:300;color:var(--gold)}
        .gold-line{width:72px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:1rem auto 0}
        .gold-line.left{margin-left:0;width:96px}
        .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
        .reveal.in{opacity:1;transform:none}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.9rem 2.1rem;border-radius:100px;border:1px solid transparent;font-family:var(--sans);font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:all .35s ease;text-decoration:none;white-space:nowrap}
        .btn-gold{background:var(--emerald-800);color:var(--ivory);border-color:var(--emerald-800)}
        .btn-gold:hover{background:var(--emerald-900);transform:translateY(-2px);box-shadow:var(--shadow)}
        .btn-outline-light{background:transparent;color:var(--ivory);border-color:rgba(253,248,240,.45)}
        .btn-outline-light:hover{background:var(--ivory);color:var(--emerald-900)}
        .btn-outline-dark{background:transparent;color:var(--emerald-800);border-color:var(--line-strong)}
        .btn-outline-dark:hover{background:var(--emerald-800);color:var(--ivory)}
        .btn-block{width:100%}
        /* Cover */
        .cover{position:fixed;inset:0;z-index:9999;max-width:100vw;overflow:hidden;background:
          radial-gradient(1200px 700px at 20% 10%, rgba(201,168,106,.18), transparent 60%),
          radial-gradient(900px 600px at 80% 90%, rgba(20,61,51,.25), transparent 60%),
          linear-gradient(180deg,var(--emerald-800),var(--emerald-900));
          display:flex;align-items:center;justify-content:center;transition:transform 1.15s cubic-bezier(.76,0,.24,1),opacity .7s ease;overflow:hidden}
        .cover.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
        .cover-ornament{position:absolute;left:50%;width:90%;max-width:900px;height:50%;border:1px solid rgba(201,168,106,.22);border-radius:50%;transform:translateX(-50%)}
        .cover-ornament--top{top:-22%}
        .cover-ornament--bottom{bottom:-22%}
        .cover-inner{text-align:center;color:var(--ivory);padding:2rem;max-width:560px;width:100%;position:relative;z-index:1;animation:coverIn 1.2s cubic-bezier(.22,1,.36,1) both}
        @keyframes coverIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
        .cover-bismillah{font-family:var(--serif);font-size:1.05rem;letter-spacing:.08em;color:var(--gold-light);display:block;margin-bottom:2rem;opacity:.9}
        .cover-sub{letter-spacing:.22em;text-transform:uppercase;font-size:.75rem;color:rgba(253,248,240,.7);margin-bottom:1.2rem}
        .cover-names{font-family:var(--script);font-size:clamp(3.2rem,10vw,5.2rem);line-height:1.05;color:var(--ivory);display:flex;flex-direction:column;align-items:center;gap:.1rem}
        .cover-names .amp{font-family:var(--serif);font-size:2rem;font-style:italic;color:var(--gold);margin:.2rem 0}
        .cover-divider{display:flex;align-items:center;justify-content:center;gap:.9rem;margin:1.6rem 0;color:var(--gold)}
        .cover-divider span{width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
        .cover-divider span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
        .cover-invite{font-family:var(--serif);font-size:1.1rem;line-height:1.6;color:rgba(253,248,240,.85);font-style:italic}
        .cover-date{margin:1.8rem 0}
        .cover-date p{font-family:var(--serif);font-size:1.25rem;letter-spacing:.06em}
        .cover-venue-small{font-family:var(--sans)!important;font-size:.82rem!important;letter-spacing:.14em!important;text-transform:uppercase;opacity:.7;margin-top:.35rem}
        .btn-open{margin-top:.8rem;background:var(--gold);border-color:var(--gold);color:var(--emerald-900)}
        .btn-open:hover{background:var(--gold-light)}
        .cover-hint{margin-top:1.8rem;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(253,248,240,.45)}
        /* Navbar */
        .navbar{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;background:rgba(253,248,240,.72);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(201,168,106,.14);transform:translateY(-100%);transition:transform .5s ease,background .3s ease,box-shadow .3s ease}
        .navbar.visible{transform:translateY(0)}
        .navbar.scrolled{background:rgba(253,248,240,.92);box-shadow:0 8px 30px rgba(10,34,28,.06)}
        .nav-container{width:min(1180px,92vw);margin:0 auto;display:flex;align-items:center;justify-content:space-between}
        .nav-logo{font-family:var(--serif);font-size:1.6rem;letter-spacing:.06em;text-decoration:none;color:var(--emerald-900);font-weight:600;display:flex;align-items:center;gap:.15rem}
        .logo-script{font-family:var(--script);font-size:1.9rem}
        .logo-amp{color:var(--gold);font-style:italic;font-size:1.2rem;margin:0 .15rem}
        .nav-links{list-style:none;display:flex;gap:2rem;align-items:center}
        .nav-link{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);text-decoration:none;position:relative;padding:.3rem 0;transition:color .25s}
        .nav-link::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--gold);transition:width .3s}
        .nav-link:hover::after{width:100%}
        .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px}
        .hamburger span{width:24px;height:1.5px;background:var(--emerald-900);transition:all .3s;display:block}
        .hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
        .hamburger.open span:nth-child(2){opacity:0}
        .hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
        /* Hero */
        .hero{min-height:100svh;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ivory);padding:calc(var(--nav-h) + 2rem) 0 3rem;overflow:hidden}
        .hero-bg{position:absolute;inset:0;background:var(--emerald-900)}
        .hero-bg::before{content:'';position:absolute;inset:0;background:
          radial-gradient(800px 500px at 50% 20%, rgba(201,168,106,.18), transparent 70%),
          radial-gradient(1000px 600px at 80% 80%, rgba(20,61,51,.6), transparent 60%)}
        .hero-pattern{position:absolute;inset:0;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a86a' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
        .hero-content{position:relative;z-index:1;max-width:760px;padding:0 1.5rem}
        .hero-subtop{letter-spacing:.22em;text-transform:uppercase;font-size:.78rem;color:rgba(253,248,240,.75);margin:1.2rem 0 .6rem}
        .hero-names{font-family:var(--script);font-size:clamp(3.4rem,9vw,5.8rem);line-height:1;letter-spacing:.02em}
        .hero-amp{font-family:var(--serif);font-size:.5em;display:block;color:var(--gold);font-style:italic;margin:.2em 0}
        .hero-invite{font-family:var(--serif);font-size:clamp(1rem,2.2vw,1.25rem);font-style:italic;color:rgba(253,248,240,.85);margin:1.6rem auto 0;max-width:520px;line-height:1.6}
        .hero-divider{display:flex;align-items:center;justify-content:center;gap:.9rem;margin:2rem 0;color:var(--gold)}
        .hero-divider span{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
        .hero-divider span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
        .hero-details{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1rem 1.6rem;margin:1rem 0 2.2rem}
        .hero-detail{display:flex;flex-direction:column;align-items:center;gap:.15rem}
        .detail-label{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-light);opacity:.9}
        .detail-value{font-family:var(--serif);font-size:1.05rem;letter-spacing:.04em}
        .dot-sep{opacity:.4;color:var(--gold)}
        .hero-scroll{position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%)}
        .hero-scroll span{display:block;width:1px;height:40px;background:linear-gradient(180deg,var(--gold),transparent);animation:scrollLine 1.8s ease-in-out infinite}
        @keyframes scrollLine{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:bottom}}
        /* Couple */
        .couple{background:var(--white)}
        .couple-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:2rem;align-items:start}
        .couple-card{text-align:center}
        .couple-img-wrap{position:relative;width:min(320px,78vw);aspect-ratio:4/5;margin:0 auto 1.6rem}
        .img-frame{position:absolute;inset:10px;border:1px solid var(--line);border-radius:20px;z-index:0}
        .couple-img{position:absolute;inset:0;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;z-index:1}
        .placeholder-bride{background:linear-gradient(135deg,#fdf8f0 0%,#efe6d3 25%,#e8d5a8 50%,#f7efe2 100%)}
        .placeholder-groom{background:linear-gradient(135deg,#0f2e26 0%,#143d33 40%,#1b4d40 100%)}
        .placeholder-bride::before{content:'I';font-family:var(--script);font-size:5rem;color:var(--gold);opacity:.65}
        .placeholder-groom::before{content:'N';font-family:var(--script);font-size:5rem;color:var(--gold-light);opacity:.8}
        .corner{position:absolute;width:28px;height:28px;z-index:2}
        .corner-tl{top:-6px;left:-6px;border-top:1.5px solid var(--gold);border-left:1.5px solid var(--gold);border-top-left-radius:8px}
        .corner-br{bottom:-6px;right:-6px;border-bottom:1.5px solid var(--gold);border-right:1.5px solid var(--gold);border-bottom-right-radius:8px}
        .couple-card h3{font-family:var(--serif);font-size:1.7rem;font-weight:500;color:var(--emerald-900)}
        .couple-role{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:.3rem 0 .8rem;font-weight:600}
        .couple-bio{font-size:.92rem;color:var(--ink-light);max-width:340px;margin:0 auto;line-height:1.7}
        .couple-quote{margin-top:1rem;font-family:var(--serif);font-style:italic;color:#a68a55;font-size:.95rem}
        .couple-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding-top:5rem}
        .couple-heart{width:54px;height:54px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:1.3rem}
        .couple-and{font-family:var(--script);font-size:2rem;color:var(--gold)}
        /* Countdown */
        .countdown-section{background:var(--emerald-800);color:var(--ivory);overflow:hidden;position:relative;padding:3.2rem 0}
        .countdown-inner{width:min(1180px,92vw);margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2rem}
        .countdown-label{font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:400}
        .countdown-label em{font-style:italic;color:var(--gold-light)}
        .countdown-date{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(253,248,240,.6);margin-top:.4rem}
        .countdown-boxes{display:flex;gap:.8rem;flex-wrap:wrap}
        .count-box{min-width:84px;padding:.9rem .6rem;border:1px solid rgba(201,168,106,.22);border-radius:14px;text-align:center;background:rgba(253,248,240,.04);backdrop-filter:blur(6px)}
        .count-box span{display:block;font-family:var(--serif);font-size:2rem;line-height:1;color:var(--ivory);font-weight:500}
        .count-box small{display:block;margin-top:.2rem;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-light)}
        /* Events */
        .events{background:var(--ivory)}
        .events-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
        .event-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:1.8rem;text-align:center;transition:transform .3s,box-shadow .3s}
        .event-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
        .event-icon{width:52px;height:52px;margin:0 auto 1rem;border-radius:50%;background:var(--cream);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);font-size:1.2rem}
        .event-card h4{font-family:var(--serif);font-size:1.3rem;color:var(--emerald-900);margin-bottom:.8rem}
        .event-meta{font-size:.88rem;color:var(--ink-light);line-height:1.6}
        .event-meta strong{color:var(--emerald-900);font-weight:600}
        .event-link{display:inline-block;margin-top:1rem;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--emerald-800);text-decoration:none;border-bottom:1px solid var(--line-strong);padding-bottom:2px}
        /* Story */
        .story{background:var(--white)}
        .timeline{position:relative;max-width:860px;margin:0 auto}
        .timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(180deg,var(--line),var(--gold),var(--line));transform:translateX(-50%)}
        .t-item{position:relative;display:flex;align-items:center;margin-bottom:3rem}
        .t-item:last-child{margin-bottom:0}
        .t-dot{position:absolute;left:50%;width:12px;height:12px;border-radius:50%;background:var(--gold);border:3px solid var(--white);box-shadow:0 0 0 4px rgba(201,168,106,.2);transform:translateX(-50%);z-index:1}
        .t-content{background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:1.4rem 1.6rem;max-width:360px;width:100%}
        .t-item:nth-child(odd) .t-content{margin-right:auto;margin-left:0;text-align:right}
        .t-item:nth-child(even){justify-content:flex-end}
        .t-item:nth-child(even) .t-content{margin-left:auto;text-align:left}
        .t-date{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.3rem}
        .t-content h4{font-family:var(--serif);font-size:1.25rem;color:var(--emerald-900);margin-bottom:.3rem}
        .t-content p{font-size:.9rem;color:var(--ink-light);line-height:1.6}
        /* Gallery */
        .gallery{background:var(--ivory)}
        .gallery-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;grid-auto-rows:180px}
        .g-item{position:relative;overflow:hidden;border-radius:14px;cursor:pointer;isolation:isolate}
        .g-item::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,34,28,.35));opacity:0;transition:opacity .35s;z-index:1}
        .g-item:hover::after{opacity:1}
        .g-placeholder{width:100%;height:100%;display:grid;place-items:center;color:var(--gold);font-family:var(--script);font-size:2.4rem;transition:transform .6s ease;position:relative}
        .g-item:hover .g-placeholder{transform:scale(1.06)}
        .g-label{position:absolute;bottom:.8rem;left:.9rem;z-index:2;color:var(--ivory);font-family:var(--serif);font-size:.9rem;opacity:0;transform:translateY(6px);transition:all .3s}
        .g-item:hover .g-label{opacity:1;transform:none}
        .g-item.w-6{grid-column:span 6}
        .g-item.w-4{grid-column:span 4}
        .g-item.w-8{grid-column:span 8}
        .g-item.w-12{grid-column:span 12}
        .g-item.h-2{grid-row:span 2}
        /* Lightbox */
        .lightbox{position:fixed;inset:0;z-index:500;background:rgba(10,34,28,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s}
        .lightbox.open{opacity:1;pointer-events:auto}
        .lb-image-wrap{max-width:min(86vw,1100px);max-height:86vh;display:flex;flex-direction:column;align-items:center;gap:1rem}
        .lb-placeholder{width:min(86vw,700px);height:min(66vh,560px);border-radius:14px;display:grid;place-items:center;font-family:var(--script);font-size:6rem;color:var(--gold)}
        .lb-caption{color:rgba(253,248,240,.8);font-family:var(--serif);font-style:italic;font-size:1rem}
        .lb-close{position:absolute;top:1.2rem;right:1.4rem;background:none;border:none;color:var(--ivory);font-size:2.4rem;cursor:pointer;line-height:1;opacity:.8}
        .lb-close:hover{opacity:1}
        .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(253,248,240,.08);border:1px solid rgba(201,168,106,.25);color:var(--ivory);width:46px;height:46px;border-radius:50%;font-size:1.6rem;cursor:pointer;display:grid;place-items:center;transition:background .2s}
        .lb-nav:hover{background:rgba(253,248,240,.16)}
        .lb-prev{left:1.2rem}
        .lb-next{right:1.2rem}
        /* Venue */
        .venue{background:var(--white)}
        .venue-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:3rem;align-items:center}
        .venue-address{font-family:var(--serif);font-size:1.15rem;line-height:1.6;color:var(--ink-light);margin:1.2rem 0}
        .venue-meta{display:flex;gap:2rem;margin:1.4rem 0;flex-wrap:wrap}
        .v-meta span{display:block;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.15rem}
        .v-meta strong{font-family:var(--serif);font-size:1.1rem;color:var(--emerald-900);font-weight:500}
        .venue-note{font-size:.9rem;color:var(--ink-light);margin-top:1rem;line-height:1.7;max-width:460px}
        .venue-map-placeholder{aspect-ratio:4/3;background:linear-gradient(135deg,var(--cream),var(--beige));border-radius:18px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;text-align:center;padding:2rem;position:relative;overflow:hidden}
        .map-ornament{position:absolute;inset:12px;border:1px dashed var(--line);border-radius:14px;pointer-events:none}
        .map-pin{font-size:2rem;color:var(--gold)}
        .map-link{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--emerald-800);text-decoration:none;border-bottom:1px solid var(--line-strong);padding-bottom:2px}
        /* RSVP */
        .rsvp{background:var(--ivory)}
        .rsvp-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:clamp(1.8rem,4vw,3rem);max-width:860px;margin:0 auto;box-shadow:var(--shadow)}
        .rsvp-head{text-align:center;margin-bottom:2rem}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-bottom:1.2rem}
        .form-group{margin-bottom:1.2rem;display:flex;flex-direction:column;gap:.4rem}
        .form-group label{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);font-weight:600}
        .form-group input,.form-group select,.form-group textarea{padding:.85rem 1rem;border:1px solid var(--line);border-radius:10px;background:var(--ivory);font-family:var(--sans);font-size:.92rem;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,168,106,.12)}
        .radio-group{display:flex;flex-direction:column;gap:.6rem;margin-top:.2rem}
        .radio{display:flex;align-items:center;gap:.6rem;font-size:.9rem;color:var(--ink-light);cursor:pointer}
        .radio input{accent-color:var(--emerald-800)}
        .error{font-size:.78rem;color:#a33;min-height:1em}
        .form-note{text-align:center;font-size:.8rem;color:var(--muted);margin-top:1rem}
        .rsvp-success{text-align:center;padding:2rem 0}
        .success-icon{width:56px;height:56px;border-radius:50%;background:var(--emerald-800);color:var(--ivory);display:grid;place-items:center;font-size:1.4rem;margin:0 auto 1rem}
        .rsvp-success h3{font-family:var(--serif);font-size:1.5rem;color:var(--emerald-900);margin-bottom:.5rem}
        .rsvp-success p{color:var(--ink-light);max-width:420px;margin:0 auto 1.4rem;font-size:.92rem}
        /* Wishes */
        .wishes{background:var(--white)}
        .wishes-layout{display:grid;grid-template-columns:360px 1fr;gap:2rem;align-items:start}
        .wish-form{background:var(--ivory);border:1px solid var(--line);border-radius:18px;padding:1.6rem}
        .wish-form h4{font-family:var(--serif);font-size:1.25rem;margin-bottom:1rem;color:var(--emerald-900)}
        .wishes-list{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;max-height:520px;overflow:auto;padding-right:.3rem}
        .wish-card{background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:1.2rem}
        .wish-card p{font-family:var(--serif);font-style:italic;font-size:1rem;line-height:1.6;color:var(--ink)}
        .wish-card small{display:block;margin-top:.8rem;font-size:.78rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
        /* Info */
        .info{background:var(--ivory)}
        .info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
        .info-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:1.5rem;text-align:center}
        .info-card .i-icon{width:48px;height:48px;margin:0 auto .8rem;border-radius:50%;background:var(--cream);display:grid;place-items:center;color:var(--gold);border:1px solid var(--line)}
        .info-card h4{font-family:var(--serif);font-size:1.1rem;color:var(--emerald-900);margin-bottom:.4rem}
        .info-card p{font-size:.88rem;color:var(--ink-light);line-height:1.6}
        /* Contact */
        .contact{background:var(--emerald-900);color:var(--ivory);position:relative;overflow:hidden}
        .contact::before{content:'';position:absolute;inset:0;background:radial-gradient(600px 400px at 30% 20%, rgba(201,168,106,.14), transparent 70%)}
        .contact-card{text-align:center;position:relative;z-index:1;max-width:640px;margin:0 auto}
        .contact-card h2{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.4rem);font-weight:400;margin-bottom:.6rem}
        .contact-card>p{color:rgba(253,248,240,.7);font-size:.92rem}
        .contact-actions{display:flex;gap:.8rem;justify-content:center;margin:1.8rem 0;flex-wrap:wrap}
        .contact-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.6rem;border-radius:100px;border:1px solid rgba(201,168,106,.35);color:var(--ivory);text-decoration:none;font-size:.85rem;letter-spacing:.08em;transition:all .25s}
        .contact-btn:hover{background:rgba(253,248,240,.08)}
        .contact-btn.whatsapp{background:var(--gold);border-color:var(--gold);color:var(--emerald-900)}
        .c-icon{width:22px;height:22px;border-radius:50%;background:rgba(253,248,240,.12);display:grid;place-items:center;font-size:.8rem}
        .contact-numbers{margin-top:1.2rem;font-size:.88rem;color:rgba(253,248,240,.7)}
        .contact-numbers strong{color:var(--gold-light)}
        /* Footer */
        .footer{background:var(--ivory);text-align:center;padding:4rem 0 2.5rem;border-top:1px solid var(--line);position:relative}
        .footer-ornament{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(420px,80vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
        .footer-names{font-family:var(--script);font-size:clamp(2.2rem,6vw,3.2rem);color:var(--emerald-900);display:flex;align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap}
        .footer-amp{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:1.6rem}
        .footer-love{font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-top:.6rem;font-weight:600}
        .footer-divider{display:flex;align-items:center;justify-content:center;gap:.8rem;margin:1.4rem 0;color:var(--gold)}
        .footer-divider span{width:48px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
        .footer-divider span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
        .footer-date{font-family:var(--serif);font-size:1.05rem;color:var(--ink-light)}
        .footer-dua{margin:1.6rem auto 0;max-width:520px;font-family:var(--serif);font-size:1.05rem;line-height:1.6;color:var(--emerald-800)}
        .footer-dua small{display:block;margin-top:.4rem;font-family:var(--sans);font-size:.82rem;color:var(--muted);font-style:normal}
        .footer-copy{margin-top:2rem;font-size:.78rem;letter-spacing:.08em;color:var(--muted)}
        /* Floating */
        .floating{position:fixed;right:1.2rem;bottom:1.2rem;z-index:80;display:flex;flex-direction:column;gap:.7rem;opacity:0;pointer-events:none;transition:opacity .4s}
        .floating.show{opacity:1;pointer-events:auto}
        .float-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .25s;text-decoration:none;color:var(--emerald-900);font-size:.9rem;font-weight:700}
        .float-btn:hover{transform:translateY(-2px)}
        .music-btn.playing{border-color:var(--gold);animation:pulse 2s infinite}
        @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,168,106,.5)}70%{box-shadow:0 0 0 10px rgba(201,168,106,0)}100%{box-shadow:0 0 0 0 rgba(201,168,106,0)}}
        .wa-btn{background:var(--emerald-800);color:var(--ivory);border-color:var(--emerald-800)}
        /* Main hidden */
        .main-hidden{opacity:0;pointer-events:none}
        .main-open{opacity:1;pointer-events:auto;animation:mainIn .9s cubic-bezier(.22,1,.36,1) both}
        @keyframes mainIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
        @media(max-width:1024px){
          .events-grid{grid-template-columns:repeat(2,1fr)}
          .venue-grid{grid-template-columns:1fr}
          .wishes-layout{grid-template-columns:1fr}
          .wishes-list{grid-template-columns:1fr 1fr}
          .info-grid{grid-template-columns:repeat(2,1fr)}
          .couple-grid{grid-template-columns:1fr;gap:3rem}
          .couple-center{padding-top:0;flex-direction:row;justify-content:center}
        }
        @media(max-width:768px){
          .nav-links{position:fixed;inset:var(--nav-h) 0 0;background:rgba(253,248,240,.98);backdrop-filter:blur(18px);flex-direction:column;justify-content:flex-start;padding:2.5rem 1.5rem;gap:1.6rem;transform:translateX(100%);transition:transform .4s cubic-bezier(.76,0,.24,1)}
          .nav-links.open{transform:none}
          .hamburger{display:flex}
          .form-row{grid-template-columns:1fr}
          .count-box{min-width:76px}
          .gallery-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:160px}
          .g-item.w-6,.g-item.w-4,.g-item.w-8,.g-item.w-12{grid-column:span 1}
          .g-item.w-12{grid-column:span 2}
          .t-item,.t-item:nth-child(even){flex-direction:column;align-items:flex-start;padding-left:2.2rem}
          .timeline::before{left:6px;transform:none}
          .t-dot{left:0;transform:none}
          .t-content{max-width:100%;width:100%;margin:0!important;text-align:left!important}
          .lb-nav{width:38px;height:38px}
        }
        @media(max-width:480px){
          .container{width:92vw}
          .events-grid{grid-template-columns:1fr}
          .info-grid{grid-template-columns:1fr}
          .wishes-list{grid-template-columns:1fr}
          .count-box{min-width:68px;padding:.8rem .4rem}
          .count-box span{font-size:1.6rem}
          .gallery-grid{grid-auto-rows:140px}
        }
